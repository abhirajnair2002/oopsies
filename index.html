<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Valentine</title>

<style>
  * {
    box-sizing: border-box;
    cursor: default;
  }

  body {
    margin: 0;
    height: 100vh;
    background: #6fa8ff;
    overflow: hidden;
    font-family: "Arial", sans-serif;
  }

  .heart {
    position: absolute;
    color: pink;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    z-index: 1;
  }

  @keyframes floatUp {
    from { transform: translateY(100vh); opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
  }

  .card {
    position: relative;
    width: 600px;
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    background: white;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    z-index: 10;
  }

  .card img {
    width: 160px;
    margin-bottom: 20px;
  }

  h1 {
    margin: 10px 0 20px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    margin-top: 20px;
  }

  button {
    padding: 15px 35px;
    font-size: 18px;
    border-radius: 40px;
    border: none;
    cursor: pointer;
    transition: transform 0.4s ease;
  }

  #yesBtn {
    background: #ff6fae;
    color: white;
    z-index: 2;
  }

  #noBtn {
    background: #ddd;
    position: relative;
    z-index: 3;
  }
</style>
</head>

<body>

<div class="card">
  <img src="bunny.png" alt="bunny" />
  <h1>Will you please be my valentine, nushi? 🥺</h1>

  <div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 😐</button>
  </div>
</div>

<script>
  // --- HEARTS GENERATOR (more hearts, denser flow) ---
  setInterval(() => {
    for (let i = 0; i < 3; i++) { // 3 hearts per interval
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerText = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 15 + Math.random() * 20 + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
  }, 200); // hearts appear twice as fast

  // --- BUTTON LOGIC ---
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");

  let noClicked = false;
  let vx = 2.8;
  let vy = 2.8;

  noBtn.addEventListener("click", () => {
    if (noClicked) return;
    noClicked = true;

    noBtn.innerText = "Sorry, nope, not accepted 😛";

    const rect = noBtn.getBoundingClientRect();
    document.body.appendChild(noBtn);

    noBtn.style.position = "fixed";
    noBtn.style.left = rect.left + "px";
    noBtn.style.top = rect.top + "px";
    noBtn.style.zIndex = "9999";

    startChase();
    startGrowingYes();
  });

  function startGrowingYes() {
    let scale = 1;
    setInterval(() => {
      scale += 0.05;
      yesBtn.style.transform = `scale(${scale})`;
    }, 300);
  }

  function startChase() {
    setInterval(() => {
      let x = noBtn.offsetLeft + vx;
      let y = noBtn.offsetTop + vy;

      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;

      if (x <= 0 || x >= maxX) vx *= -1;
      if (y <= 0 || y >= maxY) vy *= -1;

      noBtn.style.left = Math.max(0, Math.min(x, maxX)) + "px";
      noBtn.style.top = Math.max(0, Math.min(y, maxY)) + "px";
    }, 20);
  }

  document.addEventListener("mousemove", e => {
    if (!noClicked) return;

    const rect = noBtn.getBoundingClientRect();
    const dx = rect.left + rect.width / 2 - e.clientX;
    const dy = rect.top + rect.height / 2 - e.clientY;

    if (Math.abs(dx) < 120 && Math.abs(dy) < 120) {
      vx += dx > 0 ? 0.25 : -0.25;
      vy += dy > 0 ? 0.25 : -0.25;
    }
  });

  yesBtn.addEventListener("click", () => {
    window.location.href = "yay.html";
  });
</script>

</body>
</html>
